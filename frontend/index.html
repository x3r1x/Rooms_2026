<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/images/rooms_preview.png">
    <script type="module" src="logic/main.js"></script>
    <title>Rooms</title>
</head>

<body>
    <div class="wrapper-nickname" style="display: none">
        <div class="nickname-field">
            <h1>ROOMS</h1>
            <h2>ENTER YOUR NICKNAME</h2>
            <form class="get-nickname">
                <input class="input-nickname" type="text" name="username"  maxlength="10" required>
                <button class="button-send-nickname"type="submit">CONNECT</button>
            </form>
        </div>
    </div>

    <div class="wrapper-lobby">
        <div class="lobby-info">
            <h1>ROOMS</h1>
            <div class="lobby-status">
                <h2>LOBBY STATUS</h2>
                <h2>PLAYERS CONNECTED: <span id="player-connected">0</span></h2>
                <div id="lobby-list" class="lobby-list">
                </div>
            </div>
        </div>
        <div class="wrapper-start-game">
            <button class="start-game">START GAME</botton>
        </div>
    </div>
    
    <div class="main-game" style="display: none">
        <div class="game-info">
            <h1>ROOMS</h1>
            <div class="statistic">
                <h2>STATISTIC</h2>
                <div id="players-list" class="players-list">
                </div>
            </div>
            </div>
            <div class="wrapper-canvas">
                <canvas id="canvas" class="main__canvas"></canvas>
                <div id="death-screen" class="death-screen" style="display: none">
                    <h1 class="death-title">YOU DIED</h1>
                    <p class="respawn-text">Respawn in: <span id="respawn-timer">5</span>s</p>
                </div>
        
            </div>
        </div>
        <div class="screen-game-over">

        </div>
    </div>

</body>
</html>
