<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/images/rooms_preview.png">
    <script type="module" src="logic/main.js"></script>
    <title>Rooms</title>
</head>

<body>
<div class="wrapper-nickname" id="nicknameWrapper">
    <div class="nickname-field">
        <h1>ROOMS</h1>
        <h2>ENTER YOUR NICKNAME</h2>
        <div class="get-nickname">
            <input class="input-nickname" id="nicknameInput" type="text" name="username" maxlength="10" required>
            <button class="button-send-nickname" id="nicknameButton" type="submit">CONNECT</button>
        </div>
    </div>
</div>

<div class="wrapper-lobby" id="lobbyWrapper" style="display: none">
    <div class="lobby-info">
        <h1>ROOMS</h1>
        <div class="lobby-status">
            <h2>LOBBY STATUS</h2>
            <h2>PLAYERS CONNECTED: <span id="player-connected">0</span></h2>
            <div id="lobby-list" class="lobby-list">
            </div>
        </div>
    </div>
    <div class="wrapper-start-game">
        <button class="start-game" id="readyButton">START GAME</button>
    </div>
</div>

<div class="main-game" id="mainGameWrapper" style="display: none">
    <div class="game-info">
        <h1>ROOMS</h1>
        <div class="statistic">
            <h2>STATISTIC</h2>
            <div id="players-list" class="players-list">
            </div>
        </div>
    </div>
    <div class="wrapper-canvas">
        <canvas id="canvas" class="main__canvas"></canvas>
        <div id="death-screen" class="death-screen" style="display: none">
            <h1 class="death-title">YOU DIED</h1>
            <p class="respawn-text">Respawn in: <span id="respawn-timer">5</span>s</p>
        </div>

    </div>
</div>

<div class="screen-game-over" id="gameOverWrapper" style="display: none">
    <div class="result-info">
        <h1>ROOMS</h1>
        <div class="result-status">
            <h2>RESULT</h2>
            <div id="result-list" class="result-list">
            </div>
        </div>
    </div>
    <div class="wrapper-game-over-message">
        <p class="game-over-message"></p>
        <button class="restart-game">RESTART GAME</button>
    </div>
</div>
</body>
</html>
